[package]
name = "corral-engine"
description = "Orchestrates Corral: renders configs and runs DNS, PHP-FPM and the web server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
corral-core.workspace = true
corral-dns.workspace = true
corral-tls.workspace = true
corral-proxy.workspace = true
corral-supervisor.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
tar = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
