[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/prad4787/Corral"

[workspace.dependencies]
corral-core = { path = "crates/corral-core" }
corral-dns = { path = "crates/corral-dns" }
corral-tls = { path = "crates/corral-tls" }
corral-proxy = { path = "crates/corral-proxy" }
corral-supervisor = { path = "crates/corral-supervisor" }
corral-engine = { path = "crates/corral-engine" }
corral-fetch = { path = "crates/corral-fetch" }
corral-services = { path = "crates/corral-services" }
corral-mail = { path = "crates/corral-mail" }
corral-dumps = { path = "crates/corral-dumps" }
corral-system = { path = "crates/corral-system" }


anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
